name: Update data
on:
  schedule:
    - cron: "0 5 * * *"   # every day, 05:00 UTC (07:00 Paris in summer)
  workflow_dispatch:       # allows a manual run from the Actions tab
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false   # a running refresh finishes before the next one starts
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Build data
        run: python scripts/build_data.py
      - name: Commit if data changed
        run: |
          git config user.name "lecart-bot"
          git config user.email "lecart-bot@users.noreply.github.com"
          git add data.json data/ index.html og-image.png
          git diff --cached --quiet || git commit -m "Daily data update $(date -u +%F)"
          git push
